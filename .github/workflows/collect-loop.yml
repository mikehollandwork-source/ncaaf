name: collect-loop

# Continuous snapshots. GitHub's own cron fired the hourly collector only 3-5 times a day,
# so this job keeps its own clock instead: one long run (about 5h45m) that snapshots
#   - every game, all sources ("full")           every FULL_EVERY minutes
#   - games kicking off soon ("closing")         every TICK minutes in between
# and commits after each snapshot.
# Hand-off: ~35 min before its budget ends a run starts its successor, keeps collecting
# until it has seen the successor running on two checks, and starts another if that one
# died (a successor once failed on startup and the chain stopped for 5 hours).
# Watchdog: the cron fires a few times an hour; a scheduled or manual run exits at once
# when a loop is already alive, and otherwise becomes the loop.
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      parent:
        description: "run id of the loop handing off (set by the loop itself; leave empty)"
        default: ""

permissions:
  contents: write
  actions: write

env:
  TICK: 10            # minutes between snapshots
  FULL_EVERY: 30      # minutes between full snapshots
  BUDGET: 345         # minutes this run keeps looping (jobs are capped at 6h)

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Exit if a loop is already alive
        id: guard
        run: |
          others=$(gh run list --workflow collect-loop.yml --limit 30 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length" || echo 0)
          if [ -z "${{ inputs.parent }}" ] && [ "${others:-0}" -gt 0 ]; then
            echo "a loop is already running; nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != '1'

      - name: Check out data branch
        if: steps.guard.outputs.skip != '1'
        run: |
          git fetch --depth=1 origin data:refs/remotes/origin/data
          git worktree add -B data store origin/data

      - name: Snapshot loop
        if: steps.guard.outputs.skip != '1'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGIONS: ${{ vars.ODDS_API_REGIONS }}
        run: |
          start=$(date +%s); last_full=0
          commit() {
            cd store
            git add -A -- data 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git -c user.name="ncaaf-collector" -c user.email="actions@users.noreply.github.com" \
                commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ) ($1)"
              for i in 1 2 3 4 5; do
                git pull -q --rebase origin data && git push -q origin HEAD:data && break
                sleep $((2 ** i))
              done
            fi
            cd ..
          }
          successor() {   # newer runs of this workflow that are running right now
            gh run list --workflow collect-loop.yml --limit 30 --json databaseId,status \
              --jq "[.[] | select(.status == \"in_progress\" and .databaseId > $GITHUB_RUN_ID)] | length" || echo 0
          }
          last_dispatch=0; seen=0
          while :; do
            now=$(date +%s); used=$(( (now - start) / 60 ))
            if [ $used -ge $BUDGET ]; then break; fi
            if [ $used -ge $((BUDGET - 35)) ]; then
              if [ "$(successor)" -gt 0 ]; then
                seen=$((seen + 1)); if [ $seen -ge 2 ]; then echo "successor is running; done"; break; fi
              elif [ $(( now - last_dispatch )) -ge 480 ]; then
                seen=0; gh workflow run collect-loop.yml --ref "${{ github.ref_name }}" -f parent=$GITHUB_RUN_ID && last_dispatch=$now || true
              fi
            fi
            if [ $(( now - last_full )) -ge $(( FULL_EVERY * 60 - 60 )) ]; then mode=full; last_full=$now; else mode=closing; fi
            timeout 25m python -m ncaaf_tracker.collect --mode $mode --data-dir store/data || echo "collector failed ($mode), continuing"
            commit $mode
            # sleep to the next tick, measured from the start of this iteration
            nap=$(( TICK * 60 - ($(date +%s) - now) ))
            if [ $nap -gt 0 ]; then sleep $nap; fi
          done
