name: collect

# All times UTC. GitHub cron can be delayed 5-30 min under load, so the mode
# is chosen from which schedule fired, not from the wall clock.
on:
  schedule:
    - cron: "7 * * * *"                # hourly full snapshot, every game
    - cron: "22,37,52 15-23 * * 6"     # Saturday: 15-min closing-line polling (11am-8pm ET)
    - cron: "22,37,52 0-4 * * 0"       # Saturday night games (8pm-midnight ET)
    - cron: "22,37,52 22-23 * * 2-5"   # Tue-Fri night games
    - cron: "22,37,52 0-3 * * 3-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "full | closing | backfill | probe"
        default: full
      since:
        description: "backfill start date (YYYY-MM-DD)"
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Check out data branch
        run: |
          if git fetch --depth=1 origin data:refs/remotes/origin/data; then
            git worktree add -B data store origin/data
          else
            git worktree add --detach store
            cd store
            git checkout --orphan data
            git rm -rf -q .
          fi

      - name: Collect
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGIONS: ${{ vars.ODDS_API_REGIONS }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "7 * * * *" ]; then MODE=full; else MODE=closing; fi
          fi
          if [ "$MODE" = "probe" ]; then python -m ncaaf_tracker.collect --probe; exit 0; fi
          ARGS="--mode $MODE --data-dir store/data"
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          python -m ncaaf_tracker.collect $ARGS

      - name: Commit snapshot
        working-directory: store
        run: |
          if [ ! -d data ]; then echo "nothing collected"; exit 0; fi
          git add -A data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="ncaaf-collector" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push origin HEAD:data && exit 0
            sleep $((2 ** i))
          done
          exit 1
